#loadFill{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);transition:transform .16s ease-out;border-radius:inherit;background:linear-gradient(90deg,#db777f,#ffa27e 60%,#ffe7b3);box-shadow:0 0 15px #ffad8480}
.loadTrack:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#f6dfbc44,transparent);background-size:22% 100%;background-repeat:no-repeat;animation:loadScan 1.4s linear infinite}
#loadDetail{display:block;min-height:16px;letter-spacing:.07em;color:#d8c9bb;font:11px/1.45 ui-monospace,monospace}#loadRetry{margin-top:12px;padding:10px 22px;border:1px solid #e6bca6;border-radius:7px;background:#653f47;color:#fff4dc}
@keyframes loadScan{from{background-position:-30% 0}to{background-position:130% 0}}
@media(prefers-reduced-motion:reduce){.loadTrack:before{animation:none}#loadFill{transition:none}}
@media(max-height:470px){#loadingGate{padding-bottom:7vh}.loadTitle{font-size:48px;margin:6px 0 14px}}

#aimMark{position:absolute;width:24px;height:24px;box-sizing:border-box;transform:translate(-50%,-50%);pointer-events:none;border:2px solid #ffe7a7;border-radius:50%;box-shadow:0 0 0 1px #493323,0 0 8px #ffac5f72;z-index:2}
#aimMark::after{content:"";width:4px;height:4px;position:absolute;left:8px;top:8px;border-radius:50%;background:#fff1ca}
#aimMark[hidden]{display:none}
body[data-travel=ride] #touchTransform{grid-column:1;grid-row:1}

</section>
<script>
window.cityBoot=(function(){
 const gate=document.getElementById('loadingGate'),status=document.getElementById('loadStatus'),detail=document.getElementById('loadDetail'),retry=document.getElementById('loadRetry'),track=document.getElementById('loadTrack');
 let last=0,failed=false;
 retry.onclick=()=>location.reload();
 function progress(value,label,info){
  if(failed)return;
  last=Math.max(last,Math.min(100,value));document.getElementById('loadPercent').textContent=last+'%';
  document.getElementById('loadFill').style.transform='scaleX('+last/100+')';
  track.setAttribute('aria-valuenow',String(last));if(status.textContent!==label)status.textContent=label;detail.textContent=info||'';
 }
 function fail(message){
  if(!document.body.hasAttribute('data-loading')||failed)return;
  failed=true;gate.dataset.failed='true';status.textContent=message||'城市载入中断';detail.textContent='';retry.hidden=false;
 }
 window.addEventListener('error',e=>{if(e.message&&e.target===window)fail()});
 return {progress,fail,get failed(){return failed},reveal(){
  if(failed)return;delete document.body.dataset.loading;gate.hidden=true;
 }};
})();
</script>
