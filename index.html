<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

 <title>GTA VI · 罪恶都市</title><meta property="og:title" content="GTA VI · 罪恶都市">
 <style>:root {
  color-scheme: dark;
  --paper: #fff8e9;
  --muted: #c1c8bc;
  --gold: #ffca53;
  --gold-light: #ffdb84;
  --pink: #ff6fa8;
  --mint: #99e6bd;
  --ink: #12101a;
  --panel: #1b1725;
  --glass: rgba(18, 15, 26, .88);
  --line: rgba(245, 212, 232, .24);
  --ui: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --frame: clamp(24px, 4.8vw, 78px);
  --hud-x: clamp(17px, 2.45vw, 42px);
  --hud-y: clamp(16px, 2.9vh, 35px);
  --left: max(12px, env(safe-area-inset-left));
  --right: max(12px, env(safe-area-inset-right));
  --top: max(10px, env(safe-area-inset-top));
  --bottom: max(14px, env(safe-area-inset-bottom));
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--ink); color: var(--paper); font-family: var(--ui); }
button, input { font: inherit; }
button, summary { -webkit-tap-highlight-color: transparent; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, summary:focus-visible, canvas:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
[hidden] { display: none !important; }
.srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; margin: -1px; padding: 0; white-space: nowrap; clip-path: inset(50%); }
.iconSet { position: absolute; width: 0; height: 0; pointer-events: none; }
.ico { display: block; flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
#world, .shade, #menu, #hud, .veil, #loadingGate { position: fixed; inset: 0; width: 100%; height: 100%; }
@supports(height: 100dvh) { #world, .shade, #menu, #hud, .veil, #loadingGate { height: 100dvh; } }
#world { display: block; touch-action: none; }
.shade { pointer-events: none; background: linear-gradient(90deg, rgba(6,15,12,.88), rgba(12,19,15,.64) 28%, rgba(9,18,16,.16) 57%, transparent 77%), linear-gradient(0deg, rgba(6,13,10,.88), transparent 26%, transparent 75%, rgba(7,17,15,.34)); }
header { position: fixed; z-index: 3; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: max(var(--top), 3.8vh) var(--frame) 0; pointer-events: none; }
.brand { display: inline-flex; align-items: center; gap: 10px; width: fit-content; color: var(--paper); }
.brand svg { width: 35px; height: 34px; color: var(--gold); }
.brand span { font: 900 17px/.95 'Arial Black', var(--ui); letter-spacing: .065em; }
.brand b { display: block; margin-top: 5px; color: #e2e3d6; font: 700 8px/1 var(--mono); letter-spacing: .215em; }
.toolbar { display: flex; gap: 4px; pointer-events: auto; }
.toolbar button, .close {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 41px; height: 41px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 5px;
  color: var(--paper); background: var(--glass); font-size: 12px; font-weight: 750;
  transition: background .16s, border-color .16s, transform .16s;
}
.toolbar .iconButton, .close { padding: 0; width: 41px; }
.toolbar .ico, .close .ico { width: 18px; height: 18px; }
.toolbar button[aria-pressed=true] { color: var(--gold); border-color: #c3984c; }
.soundOn, #sound[aria-pressed=true] .soundOff { display: none; }
#sound[aria-pressed=true] .soundOn { display: block; }
.toolbar .onlyplay, #hud, #touch { display: none; }

/* The live title holds the left margin, leaving the parked car in the scene. */
#menu { pointer-events: none; }
.titleblock { position: absolute; left: var(--frame); top: 50%; transform: translateY(-45%); }
.eyebrow { display: flex; align-items: center; gap: 10px; font: 740 11px/1.2 var(--mono), var(--ui); letter-spacing: .16em; color: var(--gold); }
.eyebrow i, .missionHead i { width: 22px; height: 8px; display: inline-block; flex: none; transform: skewX(-19deg); background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px); }
.menuType { font-family: var(--ui); letter-spacing: .15em; }
h1, .loadTitle { display: flex; align-items: flex-end; gap: clamp(9px, 1vw, 17px); margin: clamp(18px, 2.7vh, 34px) 0 8px; color: var(--paper); white-space: nowrap; line-height: 1; }
h1 svg { width: clamp(210px, 24.3vw, 450px); height: auto; aspect-ratio: 245/82; overflow: visible; }
h1 em, .loadTitle em { padding: .20em .52em .22em; margin-bottom: .08em; transform: skewX(-10deg); color: #1a1220; background: linear-gradient(135deg, #ff7ab6, var(--gold)); font: 900 clamp(20px, 2vw, 34px)/1.05 var(--ui); letter-spacing: .04em; }
.gamePlace { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.gamePlace strong { font-size: clamp(25px, 2.5vw, 43px); font-weight: 850; letter-spacing: .06em; line-height: 1.15; }
.gamePlace span { color: #e0e1cf; padding-left: 13px; border-left: 1px solid #b5baa781; font: 700 clamp(9px, .85vw, 13px)/1.6 var(--mono); letter-spacing: .16em; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: clamp(24px, 5vh, 57px); pointer-events: auto; }
.primary, .secondary, .panelButton, #loadRetry {
  min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid transparent; border-radius: 4px; padding: 0 17px; font-size: 14px; line-height: 1.25; font-weight: 780;
  transition: transform .16s, background .16s, border-color .16s;
}
.primary, #loadRetry { background: var(--gold); color: #172018; }
.primary:disabled { opacity: .58; }
#start { min-width: clamp(134px, 12vw, 184px); justify-content: space-between; }
#start .ico { width: 19px; }
.secondary, .panelButton { color: var(--paper); background: var(--glass); border-color: var(--line); }
.secondary .ico { color: #efe5c8; width: 17px; }
footer { position: absolute; bottom: max(var(--bottom), 3.6vh); left: var(--frame); right: var(--frame); display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #f4f0d64a; }
.location, .radio { display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; }
.location .ico { width: 15px; height: 15px; color: var(--gold); }
.location strong { font-size: 12px; }.location span, .radio span { font: 700 10px/1.1 var(--mono); letter-spacing: .12em; }
.location span { color: #d6d9cb; }
.radio { pointer-events: auto; background: transparent; border: 0; padding: 6px 1px 6px 10px; border-radius: 3px; }
.radio strong { color: var(--gold); font: 790 15px/1 var(--mono); letter-spacing: -.06em; }
.bars { display: inline-flex; align-items: center; justify-content: space-between; width: 16px; height: 15px; gap: 2px; color: var(--gold); }
.bars b { width: 2px; height: 5px; background: currentColor; }.bars b:nth-child(2) { height: 11px; }.bars b:nth-child(3) { height: 15px; }.bars b:nth-child(4) { height: 8px; }
.soundon .bars b { animation: eq .53s ease-in-out alternate infinite; }.soundon .bars b:nth-child(even) { animation-delay: -.32s; }
@keyframes eq { to { transform: scaleY(.3); } }

/* Loading uses a still from the game under a warm photographic duotone. */
body[data-loading] > :is(#world,.shade,header,#menu,#hud,#dialog,#notice) { visibility: hidden; }
#loadingGate { z-index: 20; isolation: isolate; overflow: hidden; color: var(--paper); background: #20231a; }
.loadBackdrop { position: absolute; inset: 0; z-index: -1; overflow: hidden; background: #d1a85e; }
.loadBackdrop img { width: 100%; height: 100%; object-fit: cover; object-position: 63% 55%; mix-blend-mode: multiply; filter: grayscale(1) contrast(1.02); }
.loadBackdrop::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0c1814ef 2%, #0b1814b5 32%, transparent 75%), linear-gradient(0deg,#0e1713f0,transparent 55%); }
.loadingBrand { position: absolute; top: max(var(--top), 3.8vh); left: var(--frame); }
.loadCard { position: absolute; bottom: max(var(--bottom), 10vh); left: var(--frame); width: min(380px, calc(100% - 2 * var(--frame))); }
.loadTitle { margin: 15px 0 33px; gap: 8px; }
.loadTitle svg { width: clamp(137px, 14vw, 235px); height: auto; aspect-ratio: 245/82; }.loadTitle em { font-size: clamp(12px, 1.25vw, 20px); }
.loadReadout { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
#loadStatus { font-size: 13px; font-weight: 700; }
#loadPercent { font: 700 20px/1 var(--mono); color: var(--gold); }
.loadTrack { position: relative; height: 4px; margin: 11px 0 8px; background: #fff9d839; }
#loadFill { position: absolute; inset: 0; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .15s ease-out; }
#loadDetail { display: block; min-height: 14px; font: 11px/1.3 var(--mono); color: #c9d3bb; letter-spacing: .06em; }
#loadRetry { margin-top: 12px; }

/* Upper status and navigation occupy the corners of the playable field. */
body[data-screen="play"] #hud { display: block; pointer-events: none; }
body[data-screen="play"] #menu, body[data-screen="play"] .brand { display: none; }
body[data-screen="play"] header { inset: var(--hud-y) var(--hud-x) auto auto; padding: 0; }
body[data-screen="play"] .toolbar .onlyplay { display: inline-flex; }
body[data-screen="play"] .shade { background: linear-gradient(0deg,#06100b60,transparent 16%,transparent 86%,#07130f39); }
.mission, .identity, .nav, .meter, .keyhint, #destinationPin, #aimMark { position: absolute; }
.mission {
  top: var(--hud-y); left: var(--hud-x); width: max-content; max-width: min(300px, 38vw);
  padding: 12px 15px 12px 18px; border: 1px solid var(--line); border-radius: 4px;
  background: linear-gradient(105deg,rgba(14,23,18,.95),rgba(22,31,26,.82));
}
.mission::before { content: ''; position: absolute; top: 13px; left: -1px; width: 3px; height: 21px; background: var(--gold); }
.missionHead { display: flex; align-items: center; gap: 7px; color: var(--gold); }
.missionHead i { width: 13px; height: 7px; background-size: 6px; }
.missionHead small { font-size: 10px; font-weight: 750; letter-spacing: .09em; }
#missionName { display: block; font-size: clamp(17px,1.5vw,23px); line-height: 1.25; margin: 5px 0 3px; font-weight: 830; }
#missionHint { margin: 0; font-size: 12px; line-height: 1.55; color: #e3e5d7; }
.route { display: flex; align-items: flex-start; gap: 6px; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--line); color: #c5f5d7; font-size: 11px; line-height: 1.45; font-weight: 680; }
.route .ico { width: 15px; height: 15px; }
.route:has(#routeCue:empty), .route:has(#routeCue[hidden]) { display: none; }
.identity {
  top: calc(var(--hud-y) + 49px); right: var(--hud-x); display: flex; flex-direction: column;
  align-items: stretch; gap: 5px; width: max-content; min-width: 141px; max-width: min(235px, 34vw);
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass);
}
#cash { text-align: right; font: 750 14px/1.15 var(--mono), var(--ui); color: #f6f4df; white-space: nowrap; }
.health { display: flex; align-items: center; gap: 5px; color: var(--mint); }
.health { min-inline-size: calc(151px + 32px * var(--health-growth, 0)); }
.healthLabel { color: var(--mint); font: 800 10px/1 var(--mono); letter-spacing: .015em; }
.healthTrack { flex: 1; min-width: 42px; height: 5px; background: #556253; border-radius: 1px; position: relative; overflow: hidden; }
.healthTrack::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px),#19291f calc(25% - 1px) 25%); }
#hpFill { display: block; width: 100%; height: 100%; background: currentColor; transform-origin: left; transition: width .18s, transform .18s, background .18s; }
#hpText { font: 750 11px/1.2 var(--mono), var(--ui); white-space: nowrap; }
.health[data-low="true"], .health[data-state="low"], .health[data-state="critical"], .health[aria-valuenow="0"] { color: #ff9e82; }
#wanted { color: #ffbe80; text-align: right; font-size: 11px; line-height: 1.4; font-weight: 700; }
#wanted:empty { display: none; }
#bondTag { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 10.5px; line-height: 1.3; color: #f4d6e8; font-weight: 700; }
#bondTag:empty { display: none; }
.heatPill { padding: 1px 5px; border-radius: 3px; background: rgba(255, 92, 118, .28); border: 1px solid rgba(255, 118, 146, .6); color: #ffb3c4; font-size: 10px; }
#storyBanner {
  position: fixed; z-index: 7; top: 15%; left: 50%; transform: translate(-50%, -10px);
  min-width: min(360px, 84vw); max-width: min(520px, 90vw);
  padding: 14px 22px; border-radius: 6px; text-align: center; pointer-events: none;
  background: linear-gradient(135deg, rgba(22, 14, 30, .95), rgba(34, 19, 36, .92));
  border: 1px solid rgba(255, 180, 110, .55); box-shadow: 0 18px 50px rgba(0, 0, 0, .55);
  opacity: 0; transition: opacity .24s, transform .24s;
}
#storyBanner.show { opacity: 1; transform: translate(-50%, 0); }
#storyBanner[data-tone="pass"] { border-color: rgba(153, 230, 189, .75); }
#storyBanner[data-tone="alert"] { border-color: rgba(255, 111, 168, .8); }
#bannerTag { display: block; font: 750 11px/1.3 var(--mono), var(--ui); letter-spacing: .16em; color: var(--pink); }
#bannerTitle { display: block; margin: 4px 0 3px; font-size: clamp(20px, 2.3vw, 30px); font-weight: 900; letter-spacing: .04em; color: var(--gold); }
#bannerDetail { display: block; font-size: 12px; color: #ede7f2; line-height: 1.45; }
#subtitleBar {
  position: fixed; z-index: 5; left: 50%; bottom: calc(var(--hud-y) + 46px);
  transform: translate(-50%, 6px); max-width: min(640px, 86vw);
  padding: 9px 16px; border-radius: 5px; pointer-events: none;
  background: rgba(12, 10, 18, .86); border: 1px solid rgba(255, 202, 83, .32);
  font-size: 13.5px; line-height: 1.5; text-align: center;
  opacity: 0; transition: opacity .18s, transform .18s;
}
#subtitleBar.show { opacity: 1; transform: translate(-50%, 0); }
#subSpeaker { margin-right: 8px; font-weight: 850; letter-spacing: .03em; }
#subText { color: #fff8ee; font-weight: 560; }
.choiceOption {
  position: relative; display: block; width: 100%; text-align: left; margin-top: 9px; padding: 13px 34px 13px 15px;
  border-radius: 6px; border: 1px solid rgba(255, 198, 224, .28); background: linear-gradient(135deg, rgba(44, 32, 62, .94), rgba(29, 22, 42, .92)); color: var(--paper);
  transition: transform .14s, background .16s, border-color .16s, box-shadow .16s;
}
.choiceOption::after { content: '›'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 22px/1 var(--mono); color: var(--gold); opacity: .82; }
.choiceOption strong { display: block; font-size: 14.5px; line-height: 1.45; }
.choiceOption small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--gold); font-weight: 680; }
.choiceOption:hover { background: linear-gradient(135deg, rgba(64, 42, 86, .96), rgba(42, 28, 60, .95)); border-color: var(--pink); box-shadow: 0 6px 20px rgba(255, 111, 168, .18); transform: translateY(-1px); }
.chapterCard {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center;
  width: 100%; text-align: left; margin-top: 7px; padding: 11px 13px;
  border-radius: 5px; border: 1px solid var(--line); background: #241e30; color: var(--paper);
}
.chapterCard strong { font-size: 14px; }
.chapterCard small { grid-column: 1; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
.chapterCard b { grid-area: 1 / 2 / 3 / 3; font: 750 11.5px/1.2 var(--mono), var(--ui); color: var(--gold); white-space: nowrap; }
.chapterCard:hover:enabled { background: #322943; border-color: var(--gold); }
.chapterCard:disabled { opacity: .48; }
.endingBox { padding: 14px 16px; border-radius: 6px; background: linear-gradient(145deg, #2d1f3a, #1d1829); border: 1px solid rgba(255, 111, 168, .55); margin: 6px 0 14px; }
.endingBox h3 { margin: 0 0 4px; font-size: 18px; color: var(--gold); }
.endingBox .endingSub { font-size: 12px; color: var(--pink); font-weight: 700; margin-bottom: 8px; }
.endingBox p { margin: 0; font-size: 13.5px; line-height: 1.7; color: #f4eef8; }
.statStrip { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; font-size: 12px; color: var(--mint); }
.statStrip span { padding: 4px 8px; border-radius: 4px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
html[data-input="touch"] #subtitleBar { bottom: calc(var(--bottom) + 126px); font-size: 12px; padding: 7px 12px; max-width: 90vw; }
html[data-input="touch"] #storyBanner { top: 22%; padding: 10px 14px; }
#airContact { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 33px; padding: 4px 6px; background: #51392c; border: 1px solid #cf945f; border-radius: 4px; color: #ffe5b5; font-size: 11px; font-weight: 750; pointer-events: auto; }
#airContact .ico { width: 17px; height: 17px; }
#airContact:hover { background: #694832; }
.nav { bottom: var(--hud-y); left: var(--hud-x); display: flex; flex-direction: column; align-items: flex-start; }
#miniButton { position: relative; display: block; width: clamp(102px,9vw,145px); aspect-ratio: 1; padding: 0; overflow: hidden; background: var(--ink); border: 3px solid #25322a; outline: 1px solid #e0ddbd91; border-radius: 12px; box-shadow: 0 4px 16px #07150f55; pointer-events: auto; }
#miniButton::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 10px #06180d5c; border-radius: inherit; }
#miniButton:focus-visible { outline: 2px solid var(--gold); }
.nav canvas { width: 100%; height: 100%; display: block; }
.street { display: inline-flex; align-items: center; gap: 4px; margin-top: 5px; padding: 4px 7px; border-radius: 3px; background: var(--glass); color: var(--paper); font-size: 11px; font-weight: 700; }
.street .ico { width: 12px; height: 12px; color: var(--gold); }
.meter { right: var(--hud-x); bottom: var(--hud-y); padding: 8px 12px 9px 15px; text-align: right; color: var(--paper); background: linear-gradient(110deg,#101a15bd,#101a15ed); border: 1px solid var(--line); border-right: 3px solid var(--gold); border-radius: 4px; }
.meter small { display: block; font: 730 10px/1.3 var(--mono), var(--ui); letter-spacing: .04em; color: #dce0c9; }
.meter>div { display: flex; justify-content: flex-end; align-items: baseline; gap: 7px; }
#speed { font: italic 900 clamp(34px,3.6vw,58px)/1.05 'Arial Narrow',var(--ui); letter-spacing: -.07em; font-variant-numeric: tabular-nums; }
#unit { font: 700 10px/1 var(--mono); color: var(--gold); }
#unit:empty, body[data-travel="foot"] .meter small { display: none; }
body[data-travel="foot"] #speed { font: 780 15px/1.4 var(--ui); letter-spacing: .04em; }
body[data-travel="foot"] .meter { padding: 5px 10px; }
.keyhint { bottom: var(--hud-y); left: 50%; transform: translateX(-50%); padding: 7px 12px; border-radius: 3px; color: #edf0e3; background: #111a15d6; font-size: 11px; line-height: 1.45; text-align: center; max-width: calc(100% - 340px); }
.keyhint:empty { display: none; }
#notice { position: fixed; z-index: 6; top: var(--hud-y); left: 50%; transform: translate(-50%, -5px); max-width: min(66vw, 470px); padding: 10px 15px; border: 1px solid #c9aa6866; border-radius: 4px; color: var(--paper); background: #152019f2; font-size: 13px; line-height: 1.4; text-align: center; font-weight: 700; opacity: 0; transition: opacity .16s, transform .16s; pointer-events: none; }
#notice.show { opacity: 1; transform: translate(-50%, 0); }
#aimMark { z-index: 2; width: 23px; height: 23px; transform: translate(-50%,-50%); border: 2px solid #ffe9ac; border-radius: 50%; box-shadow: 0 0 0 1px #473928, 0 0 6px #34281280; }
#aimMark::after { content: ''; position: absolute; width: 3px; height: 3px; border-radius: 50%; top: 8px; left: 8px; background: #fff5d1; }
#destinationPin { --pin-size: 34px; z-index: 1; width: var(--pin-size); height: var(--pin-size); transform: translate(-50%,-50%); pointer-events: none; }
.pinDial { display: grid; place-items: center; position: absolute; inset: 0; color: var(--gold); border: 2px solid var(--gold); border-radius: 50%; width: 100%; height: 100%; background: #17221bef; box-shadow: 0 1px 6px #0a190faa; }
#pinArrow { display: block; width: 22px; height: 22px; transform-origin: center; }
#pinLabel { position: absolute; top: calc(100% + 4px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 155px; padding: 3px 7px; border-radius: 3px; background: #142018eb; color: #fff3ce; font: 750 11px/1.35 var(--mono), var(--ui); text-align: center; }
#pinLabel:empty { display: none; }
#destinationPin[data-edge="true"] .pinDial { background: var(--gold); color: #172117; box-shadow: 0 0 0 2px #172018a8; }

/* Modal forms share trim, focus, and button states with the driving instruments. */
.veil { z-index: 10; display: grid; place-items: center; background: #0c1512aa; backdrop-filter: blur(5px); padding: max(16px,var(--top)) max(16px,var(--right)) max(16px,var(--bottom)) max(16px,var(--left)); }
.panel { position: relative; width: min(480px,100%); max-height: 100%; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #647367 var(--panel); padding: clamp(20px,3vw,35px); border: 1px solid #737e6b99; border-radius: 8px; background: linear-gradient(145deg,#233027 0%,var(--panel) 45%); color: var(--paper); box-shadow: 0 24px 95px #03090588; }

<script>
window.cityBoot=(function(){
 const gate=document.getElementById('loadingGate'),status=document.getElementById('loadStatus'),detail=document.getElementById('loadDetail'),retry=document.getElementById('loadRetry'),track=document.getElementById('loadTrack');
 let last=0,failed=false;
 retry.onclick=()=>location.reload();
 function progress(value,label,info){
  if(failed)return;
  last=Math.max(last,Math.min(100,value));document.getElementById('loadPercent').textContent=last+'%';
  document.getElementById('loadFill').style.transform='scaleX('+last/100+')';
  track.setAttribute('aria-valuenow',String(last));if(status.textContent!==label)status.textContent=label;detail.textContent=info||'';
 }
 function fail(message){
  if(!document.body.hasAttribute('data-loading')||failed)return;
  failed=true;gate.dataset.failed='true';status.textContent=message||'城市载入中断';detail.textContent='';retry.hidden=false;
 }
 window.addEventListener('error',e=>{if(e.message&&e.target===window)fail()});
 return {progress,fail,get failed(){return failed},reveal(){
  if(failed)return;delete document.body.dataset.loading;gate.hidden=true;
 }};
})();
